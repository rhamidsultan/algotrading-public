name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: No secrets or data in the repo
        run: |
          bad=$(git ls-files | grep -E '(^|/)(secrets\.yaml|config\.json|token\.json|access_token[^/]*\.json|\.secret_key|\.env)$|\.pem$|\.db$|^data/(options|truedata)/.+\.csv|^runs/|^runtime/.+[^p]$' || true)
          if [ -n "$bad" ]; then echo "These files must not be in the repo:"; echo "$bad"; exit 1; fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -r requirements-server.txt flask cryptography

      - name: Tests
        run: python -m pytest -q
