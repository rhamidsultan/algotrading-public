# Copy to secrets.yaml (setup_mac.sh does it). On a Mac that works with a server, only the
# dashboard section below matters: the server does all Zerodha logins and fetches the data.
#
# kite: only for using Algo Lab WITHOUT a server (your own Kite Connect app's key and secret).
kite:
  api_key: "your_api_key"
  api_secret: "your_api_secret"
  # If another app of yours already logs in to Zerodha with this same API key, point this at the
  # file where that app saves its access token and Algo Lab will reuse that login instead of making
  # its own. (Zerodha keeps one live login per API key: a second login signs the first app out.)
  # token_file: "/home/ubuntu/portfolio/kite_token.json"

# The portfolio dashboard on the server, for sending backtests to its Backtests page (run.py publish).
# The install script on the server prints the url and user.
dashboard:
  url: "https://YOUR_DASHBOARD_ADDRESS"
  user: "admin"
  password: "your dashboard password"

# TrueData history API (run.py truedata): your trial login.
truedata:
  user: "your_truedata_user"
  password: "your_truedata_password"
