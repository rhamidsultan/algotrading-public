<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Portfolio</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#16181d;--muted:#646b78;--line:#e5e7eb;--accent:#2f6fed;--down:#c8323a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--text:#e8eaee;--muted:#8b93a1;--line:#272b35;--accent:#6c9bff;--down:#f0626a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:20px;margin:0 0 4px}
p{margin:0 0 18px;color:var(--muted);font-size:14px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--text);font-size:16px}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:14px;color:var(--muted)}
button{width:100%;margin-top:18px;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
.err{color:var(--down);font-size:14px;margin:0 0 6px}
</style>
</head>
<body>
<form method="post">
  <h1>Portfolio</h1>
  <p>Sign in to view your dashboard.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <label for="u">Username</label>
  <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" required autofocus>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <label class="row"><input type="checkbox" name="remember" checked> Keep me signed in for 30 days</label>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
